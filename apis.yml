aid: breezy
name: Breezy
description: 'Breezy is a Los Angeles-based proptech startup building what it calls
  the first independent AI operating system for residential real estate. Founded in
  2024 by top-producing agent James Harris alongside Afterpay co-founders Nick Molnar
  and Anthony Eisen, the mobile-first app consolidates an agent''s workflow — comparable
  market analysis (comps), AI meeting notes, deal-pipeline management, client insights
  and an AI assistant — into a single workspace, and adds an "UnderBuilt Radar" that
  uses zoning, geospatial and setback data to flag properties with unrealized development
  potential across 1,200+ cities. Breezy raised a $10M pre-seed led by Ribbit Capital
  with participation from Fifth Wall, DST Global Partners, Liquid 2 Ventures, O.G.
  Venture Partners, Fidji Simo and David Marcus. The company exposes no public developer
  API today; this profile tracks it as a Fifth Wall portfolio lead.'
